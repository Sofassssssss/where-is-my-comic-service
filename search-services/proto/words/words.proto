syntax = "proto3";

package words;

import "google/protobuf/empty.proto";

option go_package = "where-is-my-comic-service/search-services/proto/words";

message WordsRequest {
  string phrase = 1;
}

message WordsReply {
  repeated string words = 1;
}

service Words {
  rpc Ping(google.protobuf.Empty) returns (google.protobuf.Empty) {}

  rpc Norm(WordsRequest) returns (WordsReply) {}
  rpc NormLeaveDuplicates(WordsRequest) returns (WordsReply) {}
}
