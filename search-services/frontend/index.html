<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Where is my comic?</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
</head>
<body>
<!-- Header-->
<header>
    <button id="goToSearchBtn" class="btn btn-outline-blue icon-btn hidden" title="Back to Search">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
    </button>

    <button id="goToAdminBtn" class="btn btn-outline-blue hidden">Admin Panel</button>

    <button id="loginBtn" class="btn btn-blue icon-btn" title="Login">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
    </button>

    <button id="logoutBtn" class="btn btn-orange icon-btn hidden" title="Logout">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
    </button>
</header>

<!-- Main Search View -->
<main id="mainView">
    <h1 id="mainTitle">Where is my comic<span class="outline-mark">?</span></h1>

    <div class="search-wrapper">
        <label class="search-hint">Enter something in English to search</label>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="e.g. apple, computer...">
            <button id="searchBtn" class="btn btn-orange icon-btn" title="Search">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            </button>
        </div>
        <div class="limit-box">
            <label for="limitInput">Limit:</label>
            <input type="number" id="limitInput" value="10" min="1" max="100">
        </div>
    </div>

    <div id="comicsGrid" class="comics-grid"></div>
</main>

<!-- Admin Panel (Hidden by default) -->
<section id="adminView" class="hidden">
    <div class="admin-layout">
        <div class="admin-content">
            <h2>Admin Dashboard</h2>
            <p>Welcome! Select an action from the right menu.</p>
            <div id="adminOutput" class="admin-output"></div>
        </div>

        <aside class="admin-sidebar">
            <div class="admin-section">
                <h3>Database</h3>
                <button id="updateDbBtn" class="btn pastel-blue block-btn">Update database</button>
                <button id="clearDbBtn" class="btn pastel-red block-btn">Clear database</button>
            </div>
            <div class="admin-section">
                <h3>Statistics</h3>
                <button id="statsBtn" class="btn pastel-green block-btn">Get statistics</button>
            </div>
        </aside>
    </div>
</section>

<!-- Login Modal -->
<div id="loginModal" class="modal hidden">
    <div class="modal-content">
        <span id="closeModal" class="close">&times;</span>
        <h2>Admin Login</h2>
        <div class="input-group">
            <label>Username</label>
            <input type="text" id="usernameInput" value="">
        </div>
        <div class="input-group">
            <label>Password</label>
            <input type="password" id="passwordInput">
        </div>
        <button id="submitLoginBtn" class="btn btn-blue">Sign In</button>
        <p id="loginError" class="error-text hidden">Invalid credentials</p>
    </div>
</div>

<footer class="site-footer">
    <p>Search comics from <a href="https://xkcd.com" target="_blank" rel="noopener noreferrer" class="footer-link">xkcd.com</a></p></footer>

<!-- Image Viewer Modal -->
<div id="imageModal" class="modal hidden">
    <span id="closeImageModal" class="close" style="color: white; font-size: 2.5rem; right: 30px; top: 20px;">&times;</span>

    <div class="image-modal-content">
        <img id="enlargedImg" src="" alt="Enlarged Comic">
        <button id="downloadBtn" class="btn btn-blue" style="margin-top: 15px;">Download Image</button>
    </div>
</div>

<script src="app.js"></script>
</body>
</html>
